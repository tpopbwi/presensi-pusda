<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Admin Panel - UPT PUSDA</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="E-PUSDA Admin">
    <meta name="theme-color" content="#0d1b3e">
    
    <script>
        const GITHUB_ASSETS = "https://raw.githubusercontent.com/tpopbwi/presensi-pusda/main/assets/";
        const LOGO_INSTANSI = GITHUB_ASSETS + "logo.png";
        const API = "https://script.google.com/macros/s/AKfycbw4_9Pj_jR705woF_0TNxYUsAb79HSTRYuAGv2EblVI-Lkb27FsKxmjyGpx-vfuVzp8/exec";
    </script>

    <!-- ✅ PWA MANIFEST INLINE -->
    <link rel="manifest" id="pwaManifest">

        const manifest = {
            "name": "E-PUSDA Admin Panel",
            "short_name": "E-PUSDA Admin",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#0d1b3e",
            "theme_color": "#0d1b3e",
            "icons": [
                { "src": LOGO_INSTANSI, "sizes": "192x192", "type": "image/png" },

            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/manifest+json'});
        document.getElementById('pwaManifest').setAttribute('href', URL.createObjectURL(manifestBlob));
    </script>

    <link rel="icon" type="image/png" sizes="192x192" href="https://raw.githubusercontent.com/tpopbwi/presensi-pusda/main/assets/logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/tpopbwi/presensi-pusda/main/assets/logo.png">

    <!-- ✅ VERSI LUCIDE DIKUNCI -->
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root{--primary:#1e40af;--bg-dark:#0d1b3e;--glass:rgba(15,32,77,.65);--glass-border:rgba(255,255,255,.12);--accent:#f97316;--success:#10b981;--danger:#ef4444;--warning:#facc15;--pu-blue:#3b82f6;--sda-toska:#2dd4bf;--sidebar-width:250px}
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
        html,body{width:100%;min-height:100vh;background:var(--bg-dark);color:#f8fafc;overflow-x:hidden;scroll-behavior:smooth}
        body{display:flex;position:relative;width:100vw}
        .fixed-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at top right,#1e40af,#0d1b3e 85%),radial-gradient(circle at bottom left,rgba(59,130,246,.3),transparent 70%)}
        
        ::-webkit-scrollbar{width:6px;height:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(45,212,191,.3);border-radius:10px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(45,212,191,.6)}

        .sidebar{width:var(--sidebar-width);height:calc(100vh - 30px);position:fixed;top:15px;left:15px;background:rgba(15,32,77,.8);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid var(--glass-border);border-radius:24px;padding:20px;display:flex;flex-direction:column;z-index:1000;box-shadow:0 20px 50px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1)}
        .brand{display:flex;align-items:center;gap:12px;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid var(--glass-border)}
        .brand img{height:35px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.3)}
        .nav-link{padding:14px 16px;border-radius:14px;display:flex;align-items:center;gap:14px;color:rgba(255,255,255,.6);text-decoration:none;transition:all .3s ease;font-weight:600;margin-bottom:6px;cursor:pointer;font-size:.85rem;position:relative;overflow:hidden}
        .nav-link:hover{background:rgba(255,255,255,.05);color:white}
        .nav-link.active{background:linear-gradient(135deg,var(--pu-blue),var(--primary));color:white;box-shadow:0 8px 20px rgba(30,64,175,.4), inset 0 1px 0 rgba(255,255,255,.2)}
        .nav-link.active::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:var(--sda-toska);border-radius:0 4px 4px 0}
        .sidebar-clock{margin-top:auto;padding:15px;background:rgba(0,0,0,.3);border:1px solid var(--glass-border);border-radius:18px;text-align:center;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)}
        .sidebar-clock h2{font-family:'JetBrains Mono',monospace;font-size:1.4rem;color:var(--sda-toska);font-weight:800;text-shadow:0 0 15px rgba(45,212,191,.4)}

        .main-content{flex:1;margin-left:calc(var(--sidebar-width) + 25px);padding:0 25px 120px 15px;min-height:100vh;display:none;flex-direction:column;width:calc(100% - var(--sidebar-width) - 25px)}
        .dashboard-container{width:100%;display:flex;flex-direction:column;gap:20px}
        
        .header-actions {
            display: flex; flex-direction: column; gap: 15px; position: sticky; top: -1px; z-index: 100;
            padding: 20px 0 15px 0; background: linear-gradient(180deg, rgba(13, 27, 62, 0.98) 50%, rgba(13, 27, 62, 0.8) 80%, transparent 100%);
            backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
            -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 100%); mask-image: linear-gradient(180deg, #000 80%, transparent 100%);
            margin-bottom: 10px;
        }
        .header-top-row{display:flex;align-items:center;justify-content:space-between;width:100%;gap:10px}
        .header-title-box h1{font-size:1.6rem;font-weight:800;letter-spacing:-.5px;background:linear-gradient(135deg, #fff 0%, var(--sda-toska) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .header-controls-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%}
        .search-container{position:relative;display:flex;align-items:center;flex:1;min-width:200px}
        .search-container i{position:absolute;left:18px;color:var(--sda-toska);pointer-events:none;z-index:5;transition:all .3s}
        .search-container input{padding:14px 18px 14px 48px!important;background:rgba(0,0,0,.4)!important;border:1px solid rgba(255,255,255,.1)!important;border-radius:16px!important;font-size:16px!important;width:100%!important;height:52px;color:white;transition:all .3s}
        .search-container input:focus{border-color:var(--sda-toska)!important;background:rgba(0,0,0,.6)!important;box-shadow:0 0 0 4px rgba(45,212,191,.15), inset 0 1px 0 rgba(255,255,255,.05)}
        .filter-box-row{display:flex;gap:10px;align-items:center}
        .filter-box-row input[type="date"]{height:52px;padding:0 18px;font-size:16px;min-width:150px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.1);border-radius:16px;color:white;transition:all .3s}
        .filter-box-row input[type="date"]:focus{border-color:var(--sda-toska);box-shadow:0 0 0 4px rgba(45,212,191,.15);outline:none}

        .admin-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:24px;padding:15px;display:flex;flex-direction:column;gap:15px;backdrop-filter:blur(35px);-webkit-backdrop-filter:blur(35px);box-shadow:0 20px 40px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.05)}
        
        .table-scroll{width:100%;overflow-x:auto;border-radius:16px;border:1px solid var(--glass-border);background:rgba(0,0,0,.2);-webkit-overflow-scrolling:touch}
        table{width:100%;border-collapse:collapse;min-width:1000px}
        th{background:rgba(255,255,255,.03);text-align:left;padding:16px;font-size:.65rem;font-weight:800;text-transform:uppercase;color:var(--sda-toska);letter-spacing:1.5px;white-space:nowrap;border-bottom:1px solid var(--glass-border)}
        td{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);font-size:.85rem;color:white;vertical-align:middle;white-space:nowrap;transition:background .2s}
        tbody tr{transition:all .2s}
        tbody tr:hover{background:rgba(59,130,246,.05)}
        tbody tr:last-child td{border-bottom:none}
        .foto-pegawai-sm{width:35px;height:48px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(0,0,0,.2);overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.3)}
        .foto-pegawai-sm img{width:100%;height:100%;object-fit:cover}
        .qr-thumb-sm{width:35px;height:35px;border-radius:8px;background:white;padding:2px;cursor:pointer;transition:all .2s}
        .qr-thumb-sm:hover{transform:scale(1.1);box-shadow:0 4px 10px rgba(0,0,0,.3)}
        .action-cell{display:flex;gap:8px}
        .action-icon{width:34px;height:34px;border-radius:10px;border:1px solid var(--glass-border);background:rgba(255,255,255,.05);color:white;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:all .2s}
        .action-icon:hover{background:var(--primary);border-color:var(--pu-blue);transform:translateY(-2px);box-shadow:0 4px 10px rgba(30,64,175,.3)}
        .action-icon.delete:hover{background:var(--danger);border-color:var(--danger);box-shadow:0 4px 10px rgba(239,68,68,.3)}
        .action-icon.detail{background:rgba(45,212,191,.1);border-color:rgba(45,212,191,.3);color:var(--sda-toska)}
        .action-icon.detail:hover{background:var(--sda-toska);color:var(--bg-dark);box-shadow:0 4px 10px rgba(45,212,191,.3)}
        .action-icon.export{background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3);color:var(--success)}
        .action-icon.export:hover{background:var(--success);color:var(--bg-dark)}

        .view-toggle{display:flex;gap:4px;background:rgba(0,0,0,.4);padding:5px;border-radius:14px;border:1px solid var(--glass-border);backdrop-filter:blur(10px)}
        .view-toggle button{background:transparent;border:none;color:rgba(255,255,255,.5);padding:8px 16px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:700;transition:all .3s}
        .view-toggle button.active{background:linear-gradient(135deg,var(--pu-blue),var(--primary));color:white;box-shadow:0 4px 12px rgba(30,64,175,.4), inset 0 1px 0 rgba(255,255,255,.2)}
        .view-toggle button:hover:not(.active){color:white;background:rgba(255,255,255,.05)}

        #loginOverlay{position:fixed;inset:0;z-index:10000;background:radial-gradient(circle at center,#1e40af,#0d1b3e 100%);display:flex;align-items:center;justify-content:center;padding:20px}
        .login-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:35px;padding:40px 30px;width:100%;max-width:380px;text-align:center;backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);box-shadow:0 40px 100px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.1)}
        .login-input{margin-bottom:25px;text-align:center;font-size:1.2rem;letter-spacing:8px;height:55px;background:rgba(0,0,0,.3);border:1px solid var(--glass-border);border-radius:16px;color:white;width:100%;transition:all .3s}
        .login-input:focus{border-color:var(--sda-toska);box-shadow:0 0 0 4px rgba(45,212,191,.15);outline:none}
        .login-desc{opacity:.6;margin-bottom:30px;font-size:.85rem;font-weight:500;line-height:1.4;color:#f8fafc}
        .login-brand-img{height:40px;margin-top:25px;filter:drop-shadow(0 0 15px rgba(255,255,255,.2))}
        .version-text{font-size:.6rem;font-weight:800;opacity:.3;letter-spacing:2px;text-transform:uppercase;margin:15px 0 10px 0;color:white}
        .google-play-btn{display:inline-flex;align-items:center;gap:8px;background:#000;padding:8px 18px;border-radius:10px;border:1px solid #555;text-decoration:none;color:white;transition:all .2s;margin-top:15px}
        .gp-logo-box{width:24px;height:24px;display:flex;align-items:center;justify-content:center}
        .gp-text-wrap{text-align:left;line-height:1}
        .gp-text-top{font-size:.4rem;font-weight:500;display:block;opacity:.9;margin-bottom:1px}
        .gp-text-main{font-size:.9rem;font-weight:600;display:block;letter-spacing:-.3px}

        .modal{display:flex;position:fixed;inset:0;z-index:5000;background:rgba(13,27,62,.8);backdrop-filter:blur(25px);-webkit-backdrop-filter:blur(25px);justify-content:center;align-items:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s, visibility .3s}
        .modal.show{opacity:1;visibility:visible}
        .modal-content{max-width:700px;width:100%;background:#0f172a;border-radius:28px;border:1px solid rgba(255,255,255,.1);padding:25px;position:relative;max-height:90vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1);transform:scale(0.9) translateY(20px);transition:transform .4s cubic-bezier(0.34, 1.56, 0.64, 1)}
        .modal.show .modal-content{transform:scale(1) translateY(0)}
        .modal-title-wrap{margin-bottom:20px;border-left:5px solid var(--sda-toska);padding-left:15px}
        .modal-title-wrap h2{font-weight:800;font-size:1.2rem;letter-spacing:-.5px}
        .modal-body-p{display:grid;grid-template-columns:160px 1fr;gap:25px}
        .p-preview-frame{width:100%;aspect-ratio:2/3;border-radius:18px;border:1.5px dashed var(--glass-border);background:rgba(0,0,0,.2);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:all .3s}
        .p-preview-frame:hover{border-color:var(--sda-toska);background:rgba(45,212,191,.05)}
        .p-preview-frame img{width:100%;height:100%;object-fit:cover;z-index:2;position:absolute}
        .form-group{margin-bottom:12px}
        input,select,textarea{width:100%;background:rgba(0,0,0,.2);border:1px solid var(--glass-border);padding:12px 16px;border-radius:12px;color:white;outline:none;font-size:16px!important;-webkit-appearance:none;font-weight:600;transition:all .2s}
        input:focus,select:focus,textarea:focus{border-color:var(--sda-toska);background:rgba(0,0,0,.4);box-shadow:0 0 0 4px rgba(45,212,191,.15)}
        select option{background-color:#0f172a;color:white;padding:10px}
        label{font-size:.65rem;font-weight:800;color:var(--sda-toska);text-transform:uppercase;margin-bottom:6px;display:block;letter-spacing:.5px}
        .btn-premium{height:50px;width:100%;padding:0 20px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--pu-blue),var(--primary));color:white;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-size:.9rem;text-transform:uppercase;transition:all .2s;box-shadow:0 8px 20px rgba(30,64,175,.3)}
        .btn-premium:hover{transform:translateY(-2px);box-shadow:0 12px 25px rgba(30,64,175,.4)}
        .btn-premium:active{transform:translateY(0) scale(.98)}

        .geo-section{border-top:1px solid var(--glass-border);margin-top:20px;padding-top:20px}
        .geo-list-container{max-height:160px;overflow-y:auto;margin-bottom:15px;padding-right:5px}
        .geo-item{background:rgba(0,0,0,.2);padding:12px 15px;border-radius:12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;font-size:.8rem;border:1px solid var(--glass-border);transition:all .2s}
        .geo-item:hover{background:rgba(59,130,246,.1);border-color:rgba(59,130,246,.3)}
        .geo-item-info{flex:1}
        .geo-item-name{font-weight:800;color:var(--sda-toska);margin-bottom:4px;font-size:.85rem}
        .geo-item-coords{opacity:.6;font-family:'JetBrains Mono',monospace;font-size:.7rem}
        .btn-remove-geo{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2);width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0;margin-left:15px}
        .btn-remove-geo:hover{background:var(--danger);color:white;transform:scale(1.05)}
        .geo-inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
        .geo-actions{display:flex;gap:10px}
        .btn-get-loc{flex:1;background:rgba(45,212,191,.1);border:1px solid rgba(45,212,191,.2);color:var(--sda-toska);padding:12px;border-radius:12px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
        .btn-get-loc:hover{background:rgba(45,212,191,.2);transform:translateY(-1px)}
        .btn-add-geo{flex:1;background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);color:var(--pu-blue);padding:12px;border-radius:12px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
        .btn-add-geo:hover{background:rgba(59,130,246,.2);transform:translateY(-1px)}

        #sendingOverlay{position:fixed;inset:0;z-index:100000;background:rgba(13,27,62,.95);backdrop-filter:blur(25px);display:none;flex-direction:column;align-items:center;justify-content:center;color:white;pointer-events:all;opacity:0;transition:opacity .3s}
        #sendingOverlay.show{display:flex;opacity:1}
        .sending-loader{position:relative;width:70px;height:70px;margin-bottom:25px}
        .ring-layer{position:absolute;inset:0;border:3px solid transparent;border-radius:50%;animation:spin 1.2s linear infinite}
        .ring-1{border-top-color:var(--sda-toska);box-shadow:0 0 15px var(--sda-toska)}
        .ring-2{inset:10px;border-right-color:var(--pu-blue);animation-direction:reverse}
        .ring-3{inset:20px;border-bottom-color:var(--accent)}
        @keyframes spin{to{transform:rotate(360deg)}}

        .bottom-nav-admin{display:none;grid-template-columns:repeat(5,1fr);position:fixed;bottom:15px;left:15px;right:15px;height:65px;background:rgba(15,23,42,.9);border:1px solid var(--glass-border);border-radius:24px;z-index:1000;align-items:center;backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);box-shadow:0 15px 35px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.1)}
        .b-nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:rgba(255,255,255,.4);text-decoration:none;font-size:.55rem;font-weight:700;width:100%;cursor:pointer;text-transform:uppercase;padding:10px 0;transition:all .3s;position:relative}
        .b-nav-item.active{color:var(--sda-toska)}
        .b-nav-item.active::before{content:'';position:absolute;top:0;width:30px;height:3px;background:var(--sda-toska);border-radius:0 0 4px 4px;box-shadow:0 0 10px var(--sda-toska)}

        .badge-status{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
        .badge-aktif{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)}
        .badge-nonaktif{background:rgba(148,163,184,.1);color:#94a3b8;border:1px solid rgba(148,163,184,.2)}
        .geo-indicator{display:inline-flex;align-items:center;gap:4px;background:rgba(59,130,246,.1);color:#3b82f6;padding:5px 10px;border-radius:8px;font-size:.7rem;font-weight:600;border:1px solid rgba(59,130,246,.2)}
        .score-badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 12px;border-radius:10px;font-size:.8rem;font-weight:800;min-width:45px;font-family:'JetBrains Mono',monospace}
        .score-high{background:rgba(16,185,129,.1);color:#10b981;border:1px solid rgba(16,185,129,.2)}
        .score-mid{background:rgba(245,158,11,.1);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
        .score-low{background:rgba(239,68,68,.1);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
        #logSummaryCards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:15px;margin-bottom:20px}

        .detail-hero{display:grid;grid-template-columns:120px 1fr;gap:25px;margin-bottom:25px;padding-bottom:25px;border-bottom:1px solid var(--glass-border)}
        .detail-hero-img{width:120px;height:160px;border-radius:16px;overflow:hidden;border:2px solid var(--glass-border);background:rgba(0,0,0,.3);box-shadow:0 10px 20px rgba(0,0,0,.3)}
        .detail-hero-img img{width:100%;height:100%;object-fit:cover}
        .detail-info-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
        .detail-info-row:last-child{border-bottom:none}
        .detail-label{font-size:.75rem;opacity:.6;font-weight:700;text-transform:uppercase}
        .detail-value{font-size:.9rem;font-weight:700;color:white}
        .detail-modal-actions{display:flex;gap:10px;margin-top:20px}
        .detail-modal-actions button{flex:1;height:45px;border-radius:12px;font-size:.8rem;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s}
        .btn-edit{background:linear-gradient(135deg,var(--warning),var(--accent));color:white;border:none;box-shadow:0 5px 15px rgba(249,115,22,.3)}
        .btn-edit:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(249,115,22,.4)}
        .btn-delete{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2)}
        .btn-delete:hover{background:var(--danger);color:white}

        .desktop-card-grid{display:none;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:25px;margin-top:15px;padding:15px 0}
        .desktop-card-grid.active{display:grid}
        .table-scroll.hidden{display:none}

        .premium-card-container{position:relative;border-radius:24px;aspect-ratio:3/4;overflow:hidden;cursor:pointer;transition:all .4s cubic-bezier(0.34, 1.56, 0.64, 1);border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 30px rgba(0,0,0,.4);background:#1e293b}
        .premium-card-container:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(0,0,0,.5), 0 0 0 1px rgba(45,212,191,.3)}
        .premium-card-container:active{transform:translateY(-2px) scale(.98)}
        .premium-card-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s ease;z-index:1}
        .premium-card-container:hover .premium-card-bg{transform:scale(1.08)}
        .premium-card-overlay{position:absolute;inset:0;background:linear-gradient(to top, rgba(13,27,62,0.98) 10%, rgba(13,27,62,0.7) 40%, transparent 70%);transition:background .3s;z-index:2}
        .premium-card-container:hover .premium-card-overlay{background:linear-gradient(to top, rgba(13,27,62,0.95) 20%, rgba(13,27,62,0.8) 50%, rgba(13,27,62,0.2) 80%)}
        .premium-card-info{position:absolute;bottom:0;left:0;right:0;padding:20px 15px 15px 15px;text-align:center;z-index:3}
        .premium-card-name{font-size:1rem;font-weight:800;color:white;line-height:1.2;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.5px;text-shadow:0 2px 4px rgba(0,0,0,.8)}
        .premium-card-job{font-size:.75rem;color:var(--sda-toska);font-weight:700;margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
        .premium-card-status{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;padding:5px 12px;border-radius:15px;font-weight:800;text-transform:uppercase}
        .premium-card-status.aktif{background:rgba(16,185,129,.2);color:#10b981;border:1px solid rgba(16,185,129,.3);box-shadow:0 0 10px rgba(16,185,129,.2)}
        .premium-card-status.nonaktif{background:rgba(148,163,184,.2);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
        .premium-card-actions{position:absolute;top:12px;right:12px;display:flex;gap:6px;opacity:0;transition:all .3s;z-index:4;transform:translateY(-5px)}
        .premium-card-container:hover .premium-card-actions{opacity:1;transform:translateY(0)}
        .premium-card-actions button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.5);backdrop-filter:blur(5px);color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .premium-card-actions button:hover{background:var(--primary);transform:scale(1.1)}
        .premium-card-actions button.delete:hover{background:var(--danger)}
        .premium-card-qr{position:absolute;top:12px;left:12px;background:rgba(255,255,255,.9);padding:3px;border-radius:8px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px rgba(0,0,0,.3);opacity:.8;transition:opacity .3s;z-index:4}
        .premium-card-container:hover .premium-card-qr{opacity:1}

        .fab-add{position:fixed;bottom:100px;right:25px;width:60px;height:60px;border-radius:20px;background:linear-gradient(135deg,var(--pu-blue),var(--primary));color:white;border:none;box-shadow:0 10px 30px rgba(30,64,175,.5), inset 0 1px 0 rgba(255,255,255,.2);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:999;transition:all .3s}
        .fab-add:active{transform:scale(.9) rotate(90deg)}

        .mobile-grid-view{display:none}

        #toastContainer{position:fixed;top:20px;right:20px;z-index:100001;display:flex;flex-direction:column;gap:10px;pointer-events:none}
        .toast{padding:15px 20px;border-radius:14px;background:rgba(15,23,42,.95);backdrop-filter:blur(15px);border:1px solid var(--glass-border);color:white;font-weight:600;font-size:.85rem;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;animation:toastIn .4s cubic-bezier(0.34, 1.56, 0.64, 1);transition:all .3s;pointer-events:auto;max-width:320px}
        .toast.success{border-left:4px solid var(--success);color:#10b981}
        .toast.error{border-left:4px solid var(--danger);color:#ef4444}
        .toast.warning{border-left:4px solid var(--warning);color:#f59e0b}
        @keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

        .skeleton-cell{padding:14px 16px}
        .skeleton-line{height:12px;background:linear-gradient(90deg,rgba(255,255,255,0.05) 25%,rgba(255,255,255,0.15) 50%,rgba(255,255,255,0.05) 75%);background-size:200% 100%;border-radius:4px;animation:shimmer 1.5s infinite;width:80%}
        @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
        
        @media(max-width:768px){
            .sidebar{display:none}
            .main-content{margin-left:0;padding:0 15px 120px 15px;width:100%}
            .bottom-nav-admin{display:grid}
            .modal-content{padding:20px;border-radius:24px;max-height:95vh}
            .modal-body-p{grid-template-columns:1fr;gap:20px}
            .p-preview-frame{max-width:150px;margin:0 auto;aspect-ratio:1/1}
            .header-top-row{flex-direction:row;justify-content:space-between;align-items:center}
            .header-controls-row{flex-direction:column;align-items:stretch;gap:12px}
            .filter-box-row{width:100%;justify-content:space-between}
            .filter-box-row input[type="date"]{flex:1}
            .search-container{width:100%}
            .foto-pegawai-sm{width:35px;height:48px}
            .desktop-only{display:none!important}
            .personel-table, .view-toggle{display:none!important}
            .desktop-card-grid{display:none!important}
            .mobile-grid-view{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin-top:15px;padding:15px 0}
            .premium-card-container{border-radius:20px;aspect-ratio:3/4}
            .premium-card-container:active{transform:scale(.96);box-shadow:0 5px 15px rgba(0,0,0,.4)}
            .premium-card-bg:active{transform:scale(1.05)}
            .premium-card-info{padding:15px 10px 10px 10px}
            .premium-card-name{font-size:.85rem;margin-bottom:4px}
            .premium-card-job{font-size:.65rem;margin-bottom:8px}
            .premium-card-status{font-size:.6rem;padding:4px 10px}
            .empty-state{grid-column:1/-1;text-align:center;padding:40px 20px;opacity:.5}
            .empty-state i{margin-bottom:10px;opacity:.4}
            .fab-add{display:flex}
            #logSummaryCards{grid-template-columns:repeat(2,1fr)!important}
            #logSummaryCards .admin-card{padding:15px!important}
            #logSummaryCards .admin-card div:first-child{font-size:.7rem!important}
            #logSummaryCards .admin-card div:last-child{font-size:1.4rem!important}
            #toolModal .modal-content>div:first-of-type{grid-template-columns:1fr!important}
            .detail-hero{grid-template-columns:1fr;text-align:center}
            .detail-hero-img{margin:0 auto}
            #toastContainer{left:15px;right:15px;top:15px}
            .toast{max-width:100%}
        }
        @media(max-width:400px){
            .mobile-grid-view{grid-template-columns:repeat(2,1fr);gap:10px}
            .premium-card-container{aspect-ratio:3/4}
            .premium-card-info{padding:12px 8px 8px 8px}
            .premium-card-name{font-size:.75rem}
            .premium-card-job{font-size:.6rem}
            .fab-add{width:55px;height:55px;bottom:95px;right:20px}
